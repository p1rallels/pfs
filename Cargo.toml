[package]
name = "pfs"
version = "0.1.0"
edition = "2024"
description = "Forks of a folder, for you and your agents"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
toml_edit = "0.25.17"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
